<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="text-center mb-4"> {% if form.instance.id %} ✏️ Edit Student {% else %} ➕ Add Student Marks {% endif %} </h2>

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label>Name</label>
                {{ form.name }}
            </div>

            <div class="mb-3">
                <label>Roll</label>
                {{ form.roll }}
            </div>

            <div class="mb-3">
                <label>Subject 1</label>
                {{ form.subject1 }}
            </div>

            <div class="mb-3">
                <label>Subject 2</label>
                {{ form.subject2 }}
            </div>

            <div class="mb-3">
                <label>Subject 3</label>
                {{ form.subject3 }}
            </div>

            <button type="submit" class="btn btn-primary w-100">Save</button>
        </form>

        <a href="/" class="btn btn-secondary mt-3">📄 View Marksheet</a>
    </div>
</div>

</body>
</html>
